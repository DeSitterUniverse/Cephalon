[package]
name = "cephalon"
version = "3.0.0"
edition = "2021"
rust-version = "1.95"
description = "Native GPUI desktop client for the Cephalon local RAG workbench"
authors = ["you"]
build = "build.rs"

[[bin]]
name = "cephalon"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c39bf5abfa81e3851367be0830c6caf7360f6af3", package = "gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c39bf5abfa81e3851367be0830c6caf7360f6af3", package = "gpui_ce_platform" }
gpui_elements = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c39bf5abfa81e3851367be0830c6caf7360f6af3", package = "gpui_ce_elements" }
image = { version = "0.25.1", default-features = false, features = ["png"] }
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
pulldown-cmark = { version = "0.13.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "c39bf5abfa81e3851367be0830c6caf7360f6af3", package = "gpui-ce", features = ["test-support"] }

[build-dependencies]
winresource = "0.1.31"
