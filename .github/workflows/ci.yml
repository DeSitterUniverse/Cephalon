name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev
      - name: Install Python runtime
        run: python scripts/setup_python.py
      - name: Run Python tests
        run: python -m pytest python/test_backend_stabilization.py python/test_rag_observability.py -q
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build
      - name: Check Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
