name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfontconfig1-dev libssl-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install Python runtime
        run: python scripts/setup_python.py
      - name: Run Python tests
        run: python -m pytest python/test_backend_stabilization.py python/test_rag_observability.py -q
      - name: Check formatting
        run: cargo fmt --check
      - name: Check native GPUI-CE shell
        run: cargo check
      - name: Run native Rust tests
        run: cargo test
