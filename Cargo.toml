[package]
name = "cephalon"
version = "2.0.0"
edition = "2021"
description = "Native GPUI desktop client for the Cephalon local RAG workbench"
authors = ["you"]

[[bin]]
name = "cephalon"
path = "native/src/main.rs"

[dependencies]
gpui = "=0.2.2"
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
