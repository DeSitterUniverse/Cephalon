[pytest]
# The release helper can unpack a portable Python runtime under python/.  It is
# an application runtime, not a test package; keep pytest from collecting its
# bundled stdlib tests when running the repository's normal test command.
norecursedirs =
    .git
    .pytest_cache
    .pytest-tmp*
    pythoncore-3.14-64
    bin
    _cache
    target
    build
    dist
    node_modules
    %SystemDrive%
# Keep test cache state inside the Python tree. The repository root may contain
# a stale ACL-protected cache left by an earlier runtime, and Cargo's virtual
# workspace must never fingerprint pytest cache contents.
cache_dir = python/.pytest_cache
